<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none" role="img" aria-label="Pulse Analytics Dashboard Preview">
  <defs>
    <linearGradient id="bgP1" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3A3A3A"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#777777"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#383838"/>
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="800" height="500" fill="url(#bgP1)"/>
  
  <!-- Window Header -->
  <rect x="30" y="30" width="740" height="440" rx="8" fill="#0C0C0C" stroke="#1E1E1E" stroke-width="1"/>
  <rect x="30" y="30" width="740" height="40" rx="8" fill="#111111"/>
  <path d="M30 70 L770 70" stroke="#1A1A1A" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="54" cy="50" r="4.5" fill="#2E2E2E"/>
  <circle cx="70" cy="50" r="4.5" fill="#222222"/>
  <circle cx="86" cy="50" r="4.5" fill="#1C1C1C"/>
  <rect x="310" y="42" width="180" height="16" rx="4" fill="#161616" stroke="#222" stroke-width="0.5"/>
  <text x="400" y="54" fill="#555555" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" text-anchor="middle" letter-spacing="0.5">telemetry.apex.internal</text>

  <!-- Left Sidebar -->
  <rect x="30" y="70" width="130" height="400" fill="#0E0E0E"/>
  <line x1="160" y1="70" x2="160" y2="470" stroke="#1A1A1A"/>
  <rect x="48" y="94" width="70" height="8" rx="2" fill="#EAEAEA" opacity="0.9"/>
  
  <rect x="48" y="122" width="94" height="22" rx="4" fill="#181818" stroke="#262626" stroke-width="0.5"/>
  <rect x="56" y="129" width="8" height="8" rx="1.5" fill="#FFFFFF"/>
  <rect x="70" y="131" width="50" height="5" rx="1" fill="#CCCCCC"/>

  <rect x="56" y="160" width="8" height="8" rx="1.5" fill="#444"/>
  <rect x="70" y="162" width="58" height="5" rx="1" fill="#555"/>
  <rect x="56" y="188" width="8" height="8" rx="1.5" fill="#444"/>
  <rect x="70" y="190" width="46" height="5" rx="1" fill="#555"/>
  <rect x="56" y="216" width="8" height="8" rx="1.5" fill="#444"/>
  <rect x="70" y="218" width="52" height="5" rx="1" fill="#555"/>

  <!-- Metric Cards -->
  <!-- Metric Card 1 -->
  <rect x="180" y="90" width="175" height="80" rx="6" fill="#111111" stroke="#1F1F1F" stroke-width="1"/>
  <text x="196" y="112" fill="#666666" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">THROUGHPUT</text>
  <text x="196" y="142" fill="#F5F5F5" font-family="sans-serif" font-size="22" font-weight="700">148.2k</text>
  <text x="286" y="142" fill="#888888" font-family="sans-serif" font-size="10" font-weight="600">+18.4%</text>

  <!-- Metric Card 2 -->
  <rect x="370" y="90" width="175" height="80" rx="6" fill="#111111" stroke="#1F1F1F" stroke-width="1"/>
  <text x="386" y="112" fill="#666666" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">LATENCY (P99)</text>
  <text x="386" y="142" fill="#F5F5F5" font-family="sans-serif" font-size="22" font-weight="700">14.6ms</text>
  <text x="490" y="142" fill="#888888" font-family="sans-serif" font-size="10" font-weight="600">-3.2ms</text>

  <!-- Metric Card 3 -->
  <rect x="560" y="90" width="190" height="80" rx="6" fill="#111111" stroke="#1F1F1F" stroke-width="1"/>
  <text x="576" y="112" fill="#666666" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">HEALTH RATE</text>
  <text x="576" y="142" fill="#F5F5F5" font-family="sans-serif" font-size="22" font-weight="700">99.98%</text>
  <circle cx="682" cy="138" r="3.5" fill="#FFFFFF"/>

  <!-- Large Graph Card -->
  <rect x="180" y="185" width="570" height="265" rx="6" fill="#101010" stroke="#1E1E1E" stroke-width="1"/>
  <text x="202" y="214" fill="#F5F5F5" font-family="sans-serif" font-size="13" font-weight="600">Global Cluster Telemetry</text>
  <text x="202" y="231" fill="#666666" font-family="sans-serif" font-size="10.5">Aggregated streaming metrics across edge regions</text>

  <!-- Grid lines -->
  <line x1="202" y1="260" x2="728" y2="260" stroke="#181818" stroke-dasharray="2 3"/>
  <line x1="202" y1="305" x2="728" y2="305" stroke="#181818" stroke-dasharray="2 3"/>
  <line x1="202" y1="350" x2="728" y2="350" stroke="#181818" stroke-dasharray="2 3"/>
  <line x1="202" y1="395" x2="728" y2="395" stroke="#181818" stroke-dasharray="2 3"/>

  <!-- Waveform line graph -->
  <path d="M202 375 Q 252 355, 302 305 T 402 325 T 502 265 T 602 285 T 728 235" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="728" cy="235" r="4.5" fill="#FFFFFF"/>
  <circle cx="728" cy="235" r="9" stroke="#555555" stroke-width="1"/>

  <!-- Bar columns on bottom -->
  <rect x="220" y="370" width="10" height="30" rx="1.5" fill="url(#barGrad)"/>
  <rect x="250" y="350" width="10" height="50" rx="1.5" fill="url(#barGrad)"/>
  <rect x="280" y="335" width="10" height="65" rx="1.5" fill="url(#barGrad)"/>
  <rect x="310" y="355" width="10" height="45" rx="1.5" fill="url(#barGrad)"/>
  <rect x="340" y="320" width="10" height="80" rx="1.5" fill="url(#barGrad)"/>
  <rect x="370" y="305" width="10" height="95" rx="1.5" fill="url(#barGrad)"/>
  <rect x="400" y="330" width="10" height="70" rx="1.5" fill="url(#barGrad)"/>
</svg>
