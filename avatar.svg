<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none" role="img" aria-label="Profile Monogram">
  <defs>
    <radialGradient id="avatarBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </radialGradient>
    <linearGradient id="monogramLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#777777" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="400" height="400" rx="200" fill="url(#avatarBg)" />
  <circle cx="200" cy="200" r="199" stroke="#222222" stroke-width="1.5" />

  <!-- Minimalist Geometric Silhouette & Monogram -->
  <g transform="translate(100, 85)">
    <!-- Architectural headform -->
    <circle cx="100" cy="60" r="42" fill="#121212" stroke="#2A2A2A" stroke-width="1.5" />
    <circle cx="100" cy="60" r="26" fill="#181818" stroke="#333333" stroke-width="1" />
    
  <!-- Code Monogram Glyph with SG Identity -->
    <path d="M86 52 L100 40 L114 52 L108 68 L92 68 Z" fill="none" stroke="url(#monogramLine)" stroke-width="2" stroke-linejoin="round" />
    <text x="100" y="60" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">SG</text>
    
    <!-- Shoulders / Torso Geometric Arc -->
    <path d="M25 190 C25 138 58 122 100 122 C142 122 175 138 175 190" fill="#0E0E0E" stroke="#262626" stroke-width="1.5" />
    <path d="M45 190 C45 148 70 136 100 136 C130 136 155 148 155 190" fill="none" stroke="#2E2E2E" stroke-dasharray="3 3" stroke-width="1" />
  </g>

  <!-- Subtle corner registration mark -->
  <g stroke="#3A3A3A" stroke-width="1">
    <line x1="45" y1="55" x2="55" y2="55" />
    <line x1="45" y1="55" x2="45" y2="65" />
    <line x1="355" y1="345" x2="345" y2="345" />
    <line x1="355" y1="345" x2="355" y2="335" />
  </g>

  <!-- Monochrome studio badge -->
  <g transform="translate(230, 270)">
    <rect width="138" height="30" rx="6" fill="#0E0E0E" stroke="#2A2A2A" stroke-width="1" />
    <circle cx="16" cy="15" r="3.5" fill="#FFFFFF" />
    <text x="28" y="19" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600" letter-spacing="1">SHADOW GARDEN</text>
  </g>
</svg>
