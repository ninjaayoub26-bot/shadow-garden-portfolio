<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none" role="img" aria-label="Verve Studio Editorial Architecture Preview">
  <defs>
    <linearGradient id="bgP3" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgP3)"/>
  
  <rect x="30" y="30" width="740" height="440" rx="12" fill="#0D0D0D" stroke="#252525" stroke-width="1.5"/>
  <rect x="30" y="30" width="740" height="44" rx="12" fill="#141414"/>
  <path d="M30 74 L770 74" stroke="#1F1F1F" stroke-width="1"/>
  
  <circle cx="56" cy="52" r="5" fill="#333333"/>
  <circle cx="74" cy="52" r="5" fill="#262626"/>
  <circle cx="92" cy="52" r="5" fill="#1E1E1E"/>
  <rect x="300" y="44" width="200" height="16" rx="8" fill="#1A1A1A"/>
  <text x="400" y="56" fill="#666666" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="middle">vervestudio.design</text>

  <!-- Editorial Hero Layout -->
  <text x="70" y="145" fill="#444" font-family="sans-serif" font-size="11" letter-spacing="3">INDEPENDENT CREATIVE LAB</text>
  <text x="70" y="210" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="52" letter-spacing="-1">FORM &amp;</text>
  <text x="70" y="270" fill="#777777" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="52" letter-spacing="-1">FUNCTION.</text>

  <!-- Visual Grid Preview on the Right -->
  <g transform="translate(420, 100)">
    <!-- Main Feature Image placeholder -->
    <rect x="0" y="15" width="310" height="200" rx="6" fill="#171717" stroke="#2D2D2D"/>
    <!-- Concentric minimalist circles -->
    <circle cx="155" cy="115" r="75" stroke="#333333" stroke-width="1"/>
    <circle cx="155" cy="115" r="50" stroke="#555555" stroke-width="1.5"/>
    <circle cx="155" cy="115" r="25" fill="#222222" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Bottom sub-cards -->
    <rect x="0" y="230" width="145" height="100" rx="6" fill="#131313" stroke="#262626"/>
    <line x1="20" y1="260" x2="80" y2="260" stroke="#F5F5F5" stroke-width="2"/>
    <rect x="20" y="275" width="90" height="6" rx="3" fill="#555"/>
    <rect x="20" y="290" width="60" height="6" rx="3" fill="#3A3A3A"/>

    <rect x="165" y="230" width="145" height="100" rx="6" fill="#131313" stroke="#262626"/>
    <text x="180" y="265" fill="#888" font-family="sans-serif" font-size="11">CASE STUDY</text>
    <text x="180" y="290" fill="#FFF" font-family="sans-serif" font-size="16" font-weight="bold">03. ARCHIVE</text>
  </g>

  <!-- Left Bottom Meta -->
  <rect x="70" y="320" width="300" height="1" fill="#242424"/>
  <text x="70" y="355" fill="#999999" font-family="sans-serif" font-size="12" line-height="1.6">Crafting tactile web experiences through fluid motion,</text>
  <text x="70" y="375" fill="#999999" font-family="sans-serif" font-size="12">uncompromising typography, and accessible design code.</text>
  <rect x="70" y="405" width="120" height="28" rx="14" fill="#F5F5F5"/>
  <text x="130" y="423" fill="#080808" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">VIEW INDEX</text>
</svg>
