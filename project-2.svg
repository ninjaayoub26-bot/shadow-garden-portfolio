<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none" role="img" aria-label="Kuro Commerce Minimalist E-Commerce Platform Preview">
  <defs>
    <linearGradient id="bgP2" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="prodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgP2)"/>
  
  <!-- Browser Frame -->
  <rect x="30" y="30" width="740" height="440" rx="12" fill="#0C0C0C" stroke="#222222" stroke-width="1.5"/>
  <rect x="30" y="30" width="740" height="44" rx="12" fill="#141414"/>
  <path d="M30 74 L770 74" stroke="#202020" stroke-width="1"/>
  
  <!-- Window dots -->
  <circle cx="56" cy="52" r="5" fill="#333333"/>
  <circle cx="74" cy="52" r="5" fill="#262626"/>
  <circle cx="92" cy="52" r="5" fill="#1E1E1E"/>
  <rect x="290" y="44" width="220" height="16" rx="8" fill="#1A1A1A"/>
  <text x="400" y="56" fill="#666666" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="middle">kuro-atelier.store</text>

  <!-- Store Header -->
  <text x="60" y="112" fill="#F5F5F5" font-family="Georgia, serif" font-size="18" letter-spacing="3" font-weight="bold">KURO</text>
  <text x="280" y="110" fill="#AAAAAA" font-family="sans-serif" font-size="11" letter-spacing="1.5">COLLECTIONS</text>
  <text x="400" y="110" fill="#666666" font-family="sans-serif" font-size="11" letter-spacing="1.5">EDITORIAL</text>
  <text x="500" y="110" fill="#666666" font-family="sans-serif" font-size="11" letter-spacing="1.5">ARCHIVE</text>
  <rect x="680" y="98" width="55" height="20" rx="10" stroke="#333" fill="none"/>
  <text x="707" y="112" fill="#E0E0E0" font-family="sans-serif" font-size="10" text-anchor="middle">CART (2)</text>

  <line x1="60" y1="130" x2="740" y2="130" stroke="#1C1C1C"/>

  <!-- Hero Editorial Banner -->
  <rect x="60" y="150" width="310" height="290" rx="8" fill="url(#prodGrad)" stroke="#262626"/>
  <!-- Abstract Object geometry -->
  <circle cx="215" cy="275" r="70" stroke="#3A3A3A" stroke-width="1.5" stroke-dasharray="2 4"/>
  <rect x="175" y="235" width="80" height="80" rx="6" stroke="#FFFFFF" stroke-width="2" fill="#181818" transform="rotate(25 215 275)"/>
  <text x="80" y="185" fill="#888888" font-family="sans-serif" font-size="9" letter-spacing="2">SERIES 04 / EDITION</text>
  <text x="80" y="210" fill="#F5F5F5" font-family="Georgia, serif" font-size="20">Tactile Ceramic</text>
  <text x="80" y="415" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600">EXPLORE LOOKBOOK →</text>

  <!-- Product Card 1 -->
  <rect x="390" y="150" width="165" height="290" rx="8" fill="#101010" stroke="#222222"/>
  <rect x="405" y="165" width="135" height="175" rx="6" fill="#171717"/>
  <circle cx="472" cy="252" r="38" fill="#242424" stroke="#3A3A3A"/>
  <text x="405" y="365" fill="#F5F5F5" font-family="sans-serif" font-size="12" font-weight="600">Obelisk Lamp 01</text>
  <text x="405" y="382" fill="#777777" font-family="sans-serif" font-size="11">Cast bronze &amp; matte coal</text>
  <text x="405" y="415" fill="#E0E0E0" font-family="sans-serif" font-size="12" font-weight="600">$480.00</text>

  <!-- Product Card 2 -->
  <rect x="575" y="150" width="165" height="290" rx="8" fill="#101010" stroke="#222222"/>
  <rect x="590" y="165" width="135" height="175" rx="6" fill="#171717"/>
  <polygon points="657,215 692,280 622,280" fill="#222222" stroke="#404040"/>
  <text x="590" y="365" fill="#F5F5F5" font-family="sans-serif" font-size="12" font-weight="600">Vessel No. 8</text>
  <text x="590" y="382" fill="#777777" font-family="sans-serif" font-size="11">Smoked fluted glass</text>
  <text x="590" y="415" fill="#E0E0E0" font-family="sans-serif" font-size="12" font-weight="600">$320.00</text>
</svg>
