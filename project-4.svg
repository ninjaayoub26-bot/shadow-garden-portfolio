  <text x="75" y="174" fill="#888888" font-family="monospace" font-size="10.5">2    <tspan fill="#F5F5F5">"color"</tspan>: {</text>
  <text x="75" y="196" fill="#888888" font-family="monospace" font-size="10.5">3      <tspan fill="#CCCCCC">"surface"</tspan>: <tspan fill="#FFFFFF">"#080808"</tspan>,</text>
  <text x="75" y="218" fill="#888888" font-family="monospace" font-size="10.5">4      <tspan fill="#CCCCCC">"primary"</tspan>: <tspan fill="#FFFFFF">"#F5F5F5"</tspan>,</text>
  <text x="75" y="240" fill="#888888" font-family="monospace" font-size="10.5">5      <tspan fill="#CCCCCC">"subtle"</tspan>: <tspan fill="#FFFFFF">"#999999"</tspan></text>
  <text x="75" y="262" fill="#555555" font-family="monospace" font-size="10.5">6    },</text>
  <text x="75" y="284" fill="#888888" font-family="monospace" font-size="10.5">7    <tspan fill="#F5F5F5">"spacing"</tspan>: {</text>
  <text x="75" y="306" fill="#888888" font-family="monospace" font-size="10.5">8      <tspan fill="#CCCCCC">"base"</tspan>: <tspan fill="#E0E0E0">"1rem"</tspan>,</text>
  <text x="75" y="328" fill="#888888" font-family="monospace" font-size="10.5">9      <tspan fill="#CCCCCC">"scale"</tspan>: <tspan fill="#E0E0E0">"1.25"</tspan></text>
  <text x="75" y="350" fill="#555555" font-family="monospace" font-size="10.5">10   }</text>
  <text x="75" y="372" fill="#555555" font-family="monospace" font-size="10.5">11 }</text>
  <text x="75" y="412" fill="#EAEAEA" font-family="monospace" font-size="10.5">● Generated 42 CSS variables</text>

