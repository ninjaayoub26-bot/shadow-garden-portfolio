  <circle cx="505" cy="332" r="7" fill="#F5F5F5"/>
  <line x1="445" y1="332" x2="505" y2="332" stroke="#F5F5F5" stroke-width="1.5"/>
  <line x1="505" y1="332" x2="675" y2="332" stroke="#2A2A2A" stroke-width="1.5"/>

  <rect x="435" y="372" width="250" height="38" rx="4" fill="#141414" stroke="#242424"/>
